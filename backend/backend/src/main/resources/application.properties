spring.application.name=pricewise-backend

# Firebase Cloud Firestore Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:pricewise-ai-be26e}
firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
firebase.private-key=${FIREBASE_PRIVATE_KEY:}
google.application.credentials=${GOOGLE_APPLICATION_CREDENTIALS:}

# Server
server.port=${PORT:8080}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Pricewise Tracking Scheduler (in milliseconds, default: 60s for development)
pricewise.tracking.interval=${TRACKING_INTERVAL:60000}
pricewise.tracking.enabled=${TRACKING_ENABLED:true}

# RapidAPI Real-Time Amazon Data API Configuration
rapidapi.key=${RAPIDAPI_KEY:}
rapidapi.host=${RAPIDAPI_HOST:real-time-amazon-data.p.rapidapi.com}
pricewise.providers.amazon.country=${AMAZON_COUNTRY:IN}

# Legacy Provider API Keys (optional; if unconfigured, providers will report CONFIG_REQUIRED or UNAVAILABLE)
pricewise.providers.amazon.access-key=${AMAZON_ACCESS_KEY:}
pricewise.providers.amazon.secret-key=${AMAZON_SECRET_KEY:}
pricewise.providers.amazon.partner-tag=${AMAZON_PARTNER_TAG:}
pricewise.providers.amazon.region=${AMAZON_REGION:in}

# ReefAPI Real-Time Flipkart Data API Configuration
pricewise.providers.flipkart.api-key=${REEFAPI_KEY:${FLIPKART_API_KEY:}}
pricewise.providers.flipkart.api-url=${REEFAPI_FLIPKART_URL:https://api.reefapi.com/flipkart/v1/search}
pricewise.providers.flipkart.timeout-seconds=8

# Legacy Provider API Keys (deactivated from active search)
pricewise.providers.croma.api-key=${CROMA_API_KEY:}

# Mail Configuration (optional for price drop alerts)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true